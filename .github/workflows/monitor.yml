name: Monitor do website
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  actions: read
  pages: read
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar website, Worker, ntfy, Apps Script e workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          erros=""
          chk() { # nome url padrao
            out=$(curl -sS -L -m 25 -w "\n%{http_code}" "$2" 2>&1); code=$(echo "$out" | tail -1); body=$(echo "$out" | sed '$d')
            if [ "$code" != "200" ]; then erros="$erros\n- $1: HTTP $code"; return; fi
            if [ -n "$3" ] && ! echo "$body" | grep -q "$3"; then erros="$erros\n- $1: resposta inesperada"; fi
          }
          chk "Website (GitHub Pages)" "https://hugofao.github.io/reconstroi-conferencia/" "Inscri"
          chk "Worker Cloudflare" "https://reconstroi-conferencia.hugofao.workers.dev/" "token: sim"
          chk "ntfy.sh" "https://ntfy.sh/reconstroi-b9eaf7b17932dcd721ba53a6/json?poll=1" ""
          chk "Apps Script" "https://script.google.com/macros/s/AKfycbyTz-Wx7ndbv2eiX3I0xj_AO2oMhmGSDbADZbEWAa8U0L7KKX9JQqIxUlznyryFtcIS/exec" ""
          b=$(gh api repos/$REPO/pages/builds/latest --jq .status 2>&1) || b="erro"
          [ "$b" = "built" ] || erros="$erros\n- Build do GitHub Pages: $b"
          r=$(gh api "repos/$REPO/actions/workflows/inscricoes.yml/runs?per_page=1" --jq '.workflow_runs[0].conclusion' 2>&1) || r="erro"
          case "$r" in success|""|null|cancelled) ;; *) erros="$erros\n- Workflow das inscrições (backup Excel): $r";; esac
          if [ -n "$erros" ]; then printf "PROBLEMAS DETETADOS:$erros\n"; exit 1; fi
          echo "Tudo OK"
